<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بيتر ♥️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at top, #3b040e 0%, #1a0105 55%, #080001 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow-x: hidden;
            position: relative;
            padding: 20px 0;
        }

        .bg-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .floating-item {
            position: absolute;
            bottom: -50px;
            animation: floatUp linear infinite;
            opacity: 0;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg) scale(0.7); opacity: 0; }
            20% { opacity: 0.75; }
            80% { opacity: 0.6; }
            100% { transform: translateY(-110vh) rotate(360deg) scale(1.3); opacity: 0; }
        }

        .card {
            background: linear-gradient(145deg, rgba(42, 4, 12, 0.92), rgba(18, 1, 5, 0.96));
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 77, 109, 0.35);
            border-radius: 30px;
            padding: 32px 24px;
            width: 92%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 35px rgba(255, 42, 85, 0.2);
            z-index: 10;
            position: relative;
        }

        .cake-icon {
            font-size: 62px;
            margin-bottom: 10px;
            display: inline-block;
            animation: cakeBounce 2.2s ease-in-out infinite;
            filter: drop-shadow(0 0 15px rgba(255, 105, 180, 0.5));
        }

        @keyframes cakeBounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(3deg); }
        }

        .title-italic {
            font-size: 26px;
            font-weight: 900;
            color: #ffccd5;
            margin-bottom: 12px;
            font-style: italic;
            transform: skewX(-6deg);
            text-shadow: 0 0 15px rgba(255, 77, 109, 0.6);
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border-radius: 16px;
            border: 1.5px solid rgba(255, 117, 143, 0.45);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 18px;
            text-align: center;
            margin: 15px 0 20px 0;
            outline: none;
            transition: 0.3s;
            letter-spacing: 2px;
        }

        input[type="text"]:focus {
            border-color: #ff4d6d;
            background: rgba(255, 77, 109, 0.1);
            box-shadow: 0 0 20px rgba(255, 77, 109, 0.35);
        }

        .main-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #e01e37 0%, #800f2f 100%);
            color: #fff;
            font-size: 17px;
            font-weight: 700;
            font-style: italic;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(224, 30, 55, 0.4);
            transition: all 0.3s ease;
        }

        .main-btn:active {
            transform: scale(0.97);
        }

        .q-badge {
            display: inline-block;
            background: rgba(255, 77, 109, 0.2);
            border: 1px solid rgba(255, 143, 163, 0.4);
            color: #ffb3c1;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            font-style: italic;
            margin-bottom: 14px;
        }

        .q-text {
            font-size: 18px;
            font-weight: 700;
            font-style: italic;
            transform: skewX(-4deg);
            color: #fff0f3;
            line-height: 1.7;
            margin-bottom: 22px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 143, 163, 0.3);
            border-radius: 15px;
            color: #ffe5ec;
            font-family: 'Cairo', sans-serif;
            font-size: 15px;
            font-weight: 600;
            font-style: italic;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
        }

        .option-btn:hover {
            background: rgba(255, 77, 109, 0.25);
            border-color: #ff4d6d;
            transform: translateX(-4px);
        }

        .feedback-msg {
            margin-top: 16px;
            font-size: 15px;
            font-weight: 700;
            font-style: italic;
            min-height: 24px;
        }

        .creative-counter {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 18px 0 22px 0;
        }

        .counter-box {
            background: linear-gradient(160deg, rgba(255, 77, 109, 0.18), rgba(89, 13, 34, 0.45));
            border: 1px solid rgba(255, 117, 143, 0.4);
            border-radius: 18px;
            padding: 12px 6px;
            position: relative;
            box-shadow: inset 0 0 15px rgba(255, 77, 109, 0.15), 0 8px 20px rgba(0, 0, 0, 0.5);
        }

        .counter-num {
            display: block;
            font-size: 21px;
            font-weight: 900;
            color: #ffb3c1;
            font-style: italic;
        }

        .counter-label {
            font-size: 12px;
            color: #ffccd5;
            font-weight: 600;
        }

        .message-container {
            background: rgba(15, 2, 5, 0.75);
            border: 1px solid rgba(255, 117, 143, 0.35);
            border-right: 4px solid #ff4d6d;
            border-radius: 20px;
            padding: 20px 18px;
            text-align: right;
            max-height: 360px;
            overflow-y: auto;
        }

        .typed-text {
            font-size: 16.5px;
            line-height: 2;
            color: #fff0f3;
            font-style: italic;
            white-space: pre-line;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 18px;
            background-color: #ff4d6d;
            margin-right: 4px;
            animation: blink 0.7s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .hidden {
            display: none !important;
        }

        .message-container::-webkit-scrollbar {
            width: 5px;
        }
        .message-container::-webkit-scrollbar-thumb {
            background: #ff4d6d;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="bg-elements" id="bgElements"></div>

    <!-- المرحلة الأولى: الباسورد -->
    <div class="card" id="passScreen">
        <div class="cake-icon">🎂</div>
        <h1 class="title-italic">بيتر ♥️</h1>
        <input type="text" id="passInput" placeholder="اكتب الباسورد هنا (3122005)..." autocomplete="off">
        <button class="main-btn" onclick="checkPass()">دخول ♥️</button>
        <p class="feedback-msg" id="passFeedback" style="color: #ff758f;"></p>
    </div>

    <!-- المرحلة الثانية: الأسئلة -->
    <div class="card hidden" id="quizScreen">
        <div class="cake-icon" id="qIcon">🔮</div>
        <div><span class="q-badge" id="qTitle"></span></div>
        <p class="q-text" id="qText"></p>
        <div class="options-list" id="optionsContainer"></div>
        <p class="feedback-msg" id="quizFeedback"></p>
    </div>

    <!-- المرحلة الثالثة: العداد والكلام -->
    <div class="card hidden" id="finalScreen" style="max-width: 480px;">
        <div class="cake-icon">🎂</div>
        <h1 class="title-italic">بيتر ♥️</h1>
        
        <div class="creative-counter">
            <div class="counter-box"><span class="counter-num" id="years">0</span><span class="counter-label">سنة</span></div>
            <div class="counter-box"><span class="counter-num" id="months">0</span><span class="counter-label">شهر</span></div>
            <div class="counter-box"><span class="counter-num" id="days">0</span><span class="counter-label">يوم</span></div>
            <div class="counter-box"><span class="counter-num" id="hours">0</span><span class="counter-label">ساعة</span></div>
            <div class="counter-box"><span class="counter-num" id="minutes">0</span><span class="counter-label">دقيقة</span></div>
            <div class="counter-box"><span class="counter-num" id="seconds">0</span><span class="counter-label">ثانية</span></div>
        </div>

        <div class="message-container" id="msgScrollBox">
            <span class="typed-text" id="typedOutput"></span><span class="cursor"></span>
        </div>
    </div>

    <script>
        const bgContainer = document.getElementById('bgElements');
        const symbols = ['♥️', '✨', '💖', '🎂', '💫', '❤️'];
        for (let i = 0; i < 25; i++) {
            const el = document.createElement('div');
            el.className = 'floating-item';
            el.innerText = symbols[Math.floor(Math.random() * symbols.length)];
            el.style.left = Math.random() * 100 + 'vw';
            el.style.fontSize = (Math.random() * 16 + 14) + 'px';
            el.style.animationDuration = (Math.random() * 6 + 6) + 's';
            el.style.animationDelay = (Math.random() * 6) + 's';
            bgContainer.appendChild(el);
        }

        function checkPass() {
            const input = document.getElementById('passInput').value.trim();
            const feedback = document.getElementById('passFeedback');
            if (input === "3122005") {
                document.getElementById('passScreen').classList.add('hidden');
                document.getElementById('quizScreen').classList.remove('hidden');
                renderQuestion();
            } else {
                feedback.innerText = "كلمة السر غلط ❌ (اكتب 3122005)";
            }
        }

        const quizData = [
            {
                icon: "🔮",
                title: 'سؤال "الوضع في المستقبل" 🔮',
                question: '"تفتكر بعد 10 سنين واحنا قاعدين سوا بنشرب قهوة، هنكون بنتحاسب على إمين؟"',
                options: [
                    { text: "مين نسى مفتاح البيت عالباب", isCorrect: true, reply: "إجابة صح 🔑" },
                    { text: "مين اللي أكل آخر حتة شيكولاتة في الثلاجة", isCorrect: true, reply: "إجابة صح برضه 😂" },
                    { text: "على مين الدور يعمل الشاي ❤️", isCorrect: false, reply: "جرب اختيار تاني ❤️" }
                ]
            },
            {
                icon: "👀",
                title: 'سؤال "لغة العيون" 👀',
                question: '"لما ببص لك كده من غير ما أنطق بكلمة، بكون بفكر في إيه غالباً؟"',
                options: [
                    { text: "يارب يسكت شوية هههه", isCorrect: false, reply: "ايه القسوة دي! راجع نفسك 😂" },
                    { text: "يا بختي بيه والله ❤️", isCorrect: true, reply: "إجابة صح ✨" },
                    { text: "بكون بخطط لمصيبة جديدة 😈", isCorrect: false, reply: "لأ، فكر تاني 😈" }
                ]
            },
            {
                icon: "🧭",
                title: 'سؤال "البوصلة" 🧭',
                question: '"لو الدنيا كلها اتلخبطت وسابت بعضها، إيه أكتر حاجة بتخلّي يومك يتظبط ويرجع مكانه؟"',
                options: [
                    { text: "ضحكة منك أو مسج في وسط اليوم", isCorrect: true, reply: "إجابة صح وحلوة أوي 🥰" },
                    { text: "الأكل طبعاً", isCorrect: false, reply: "ركز شوية 😂" },
                    { text: "النوم العميق", isCorrect: false, reply: "حاول تاني 😴" }
                ]
            }
        ];

        let currentStep = 0;
        let isTransitioning = false;

        function renderQuestion() {
            isTransitioning = false;
            const q = quizData[currentStep];
            document.getElementById('qIcon').innerText = q.icon;
            document.getElementById('qTitle').innerText = q.title;
            document.getElementById('qText').innerText = q.question;
            document.getElementById('quizFeedback').innerText = "";

            const container = document.getElementById('optionsContainer');
            container.innerHTML = "";

            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt.text;
                btn.onclick = () => handleOption(opt);
                container.appendChild(btn);
            });
        }

        function handleOption(opt) {
            if (isTransitioning) return;
            const feedback = document.getElementById('quizFeedback');

            if (opt.isCorrect) {
                isTransitioning = true;
                feedback.style.color = "#80ed99";
                feedback.innerText = opt.reply;
                setTimeout(() => {
                    currentStep++;
                    if (currentStep < quizData.length) {
                        renderQuestion();
                    } else {
                        document.getElementById('quizScreen').classList.add('hidden');
                        document.getElementById('finalScreen').classList.remove('hidden');
                        startBirthCounter();
                        startTypeWriter();
                    }
                }, 1300);
            } else {
                feedback.style.color = "#ff758f";
                feedback.innerText = opt.reply;
            }
        }

        function startBirthCounter() {
            const birthDate = new Date(2005, 11, 3, 0, 0, 0);

            function update() {
                const now = new Date();
                let years = now.getFullYear() - birthDate.getFullYear();
                let months = now.getMonth() - birthDate.getMonth();
                let days = now.getDate() - birthDate.getDate();
                let hours = now.getHours() - birthDate.getHours();
                let minutes = now.getMinutes() - birthDate.getMinutes();
                let seconds = now.getSeconds() - birthDate.getSeconds();

                if (seconds < 0) { seconds += 60; minutes--; }
                if (minutes < 0) { minutes += 60; hours--; }
                if (hours < 0) { hours += 24; days--; }
                if (days < 0) {
                    const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
                    days += prevMonth.getDate();
                    months--;
                }
                if (months < 0) { months += 12; years--; }

                document.getElementById('years').innerText = years;
                document.getElementById('months').innerText = months;
                document.getElementById('days').innerText = days;
                document.getElementById('hours').innerText = hours;
                document.getElementById('minutes').innerText = minutes;
                document.getElementById('seconds').innerText = seconds;
            }

            update();
            setInterval(update, 1000);
        }

        const fullMessage = `كل سنة وإنت حبيبي وأجمل حاجة حصلتلي ❤️🎂🥹 النهارده مش يوم عادي خالص بالنسبالي، ده أول عيد ميلاد ليك وإحنا مع بعض، وأول مرة أكون جنبك في يوم زي ده، وده لوحده مخليني فرحانة بشكل مش قادره أوصفه 🥹❤️ كل سنة وإنت معايا وقريب مني، وكل سنة وإنت الشخص اللي بيفرح قلبي وبيخليني أحس إن الدنيا لسه فيها حاجات حلوة 🫂❤️ نفسي السنة الجديدة من عمرك تكون كلها فرحة ونجاح وراحة بال، وربنا يحققلك كل اللي نفسك فيه ويبعد عنك أي حاجة تضايقك أو تكسر خاطرك 🤲🏻❤️ وأتمنى أفضل موجودة في كل أعياد ميلادك الجاية، وأفضل أول واحدة تقولك كل سنة وإنت طيب يا حبيبي، وأشوفك كل سنة بتكبر قدامي وأنا لسه بحبك أكتر من السنة اللي قبلها 🥹❤️ أنا يمكن معرفش أوصفلك قد إيه وجودك بقى مهم عندي، بس عايزاك تعرف إنك غالي على قلبي أوي، وإن أول عيد ميلاد لينا سوا ده هيفضل ذكرى حلوة عندي مهما عدّى وقت ❤️🥹 ربنا يخليك ليا وما يحرمنيش منك ولا من ضحكتك ولا من وجودك في حياتي، ويجمعنا دايمًا على خير وحب وفرحة ❤️🫂 كل سنة وإنت حبيبي، وكل سنة وإنت أقرب حد لقلبي، وكل سنة وإنت أحلى واحد في حياتي ❤️🎂🥹 بحبك أوي أوي، وأتمنى يكون ده أول عيد ميلاد من أعياد ميلاد كتير نحتفل بيها سوا ❤️‍🩹🎉 كل سنة وإنت بخير يا حبيبي، وعقبال مليون سنة وإنت معايا وفي قلبي ❤️🥹🫂
بحبك بطريقه متتوصفش بجد 🌚♥️♥️♥️ 
اول عيد ميلاد ليك واحنا سوا ومش اخر عيد ميلاد وزي النهارده نكون بنحتفل باحلي عيد ميلاد في الدنيا في بيتنا يحبيبي وعقبال كل سنه واحنا مع بعض يحبيبي 🌚🫂♥️♥️♥️♥️`;

        let idx = 0;
        const outputEl = document.getElementById('typedOutput');
        const scrollBox = document.getElementById('msgScrollBox');

        function startTypeWriter() {
            if (idx < fullMessage.length) {
                outputEl.textContent += fullMessage.charAt(idx);
                idx++;
                scrollBox.scrollTop = scrollBox.scrollHeight;
                setTimeout(startTypeWriter, 45);
            }
        }
    </script>
</body>
</html>
