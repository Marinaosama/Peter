<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كل سنة وأنت طيب يا بيتر ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #4a0e17, #80132b, #2b060c);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow-x: hidden;
            position: relative;
        }
        /* خلفية قلوب متحركة */
        .heart-bg {
            position: absolute;
            color: rgba(255, 105, 180, 0.2);
            animation: floatUp 6s linear infinite;
            z-index: 1;
            user-select: none;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
        .container {
            background: rgba(45, 8, 14, 0.85);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            width: 90%;
            max-width: 450px;
            text-align: center;
            z-index: 10;
            border: 2px solid rgba(255, 182, 193, 0.3);
            backdrop-filter: blur(5px);
        }
        h1 {
            color: #ffb6c1;
            margin-bottom: 20px;
            font-size: 26px;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.5);
        }
        .cake {
            font-size: 50px;
            margin-bottom: 10px;
            animation: bounce 1.5s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 2px solid #ff69b4;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 16px;
            text-align: center;
            outline: none;
        }
        input::placeholder {
            color: #ffb6c1;
        }
        button {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4);
            transition: 0.3s;
        }
        button:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }
        .hidden {
            display: none;
        }
        .typing-text {
            font-size: 20px;
            color: #ffe4e1;
            line-height: 1.6;
            margin-bottom: 20px;
            border-left: 3px solid #ff69b4;
            padding-right: 10px;
            display: inline-block;
            text-align: right;
        }
        .ticker {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: rgba(45, 8, 14, 0.9);
            color: #ffb6c1;
            padding: 10px;
            font-size: 14px;
            border-top: 1px solid rgba(255, 105, 180, 0.3);
            z-index: 100;
        }
        .countdown-box {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }
        .time-card {
            background: rgba(255, 105, 180, 0.15);
            padding: 10px;
            border-radius: 10px;
            min-width: 60px;
            border: 1px solid rgba(255, 105, 180, 0.4);
        }
        .time-card span {
            display: block;
            font-size: 20px;
            font-weight: bold;
            color: #ffb6c1;
        }
        .time-card label {
            font-size: 12px;
            color: #ddd;
        }
    </style>
</head>
<body>

    <!-- قلوب متحركة في الخلفية -->
    <div class="heart-bg" style="left: 10%; animation-duration: 5s;">❤️</div>
    <div class="heart-bg" style="left: 30%; animation-duration: 7s;">💖</div>
    <div class="heart-bg" style="left: 50%; animation-duration: 4s;">❤️</div>
    <div class="heart-bg" style="left: 70%; animation-duration: 6s;">💗</div>
    <div class="heart-bg" style="left: 90%; animation-duration: 8s;">❤️</div>

    <div class="container" id="step1">
        <div class="cake">🎂</div>
        <h1>كل سنة وأنت طيب يحبيبي 🌚</h1>
        <p style="color: #ffb6c1; margin-bottom: 15px;">اكتب باسورد احلي واحد جه الدنيا دي 🫂</p>
        <input type="password" id="passInput" placeholder="اكتب الباسورد هنا...">
        <button onclick="checkPassword()">دخول</button>
        <p id="errorMsg" style="color: #ff4b2b; margin-top: 10px; display: none;">حاول تاني يا حبيبي ❤️</p>
    </div>

    <div class="container hidden" id="step2">
        <div class="cake">✨</div>
        <h2 style="color: #ffb6c1; margin-bottom: 15px;">جاوب يحييبي 🌚</h2>
        <p id="questionText" style="font-size: 18px; margin-bottom: 15px;"></p>
        <input type="text" id="answerInput" placeholder="اكتب إجابتك هنا...">
        <button onclick="checkAnswer()">تأكيد الإجابة</button>
    </div>

    <div class="container hidden" id="step3">
        <div class="cake">🎉</div>
        <div class="typing-text" id="finalMessage"></div>
        <div class="countdown-box">
            <div class="time-card"><span id="days">0</span><label>يوم</label></div>
            <div class="time-card"><span id="hours">0</span><label>ساعة</label></div>
            <div class="time-card"><span id="minutes">0</span><label>دقيقة</label></div>
            <div class="time-card"><span id="seconds">0</span><label>ثانية</label></div>
        </div>
        <p style="color: #ffb6c1; margin-top: 15px; font-size: 15px;">عقبال العمر كله سوا يا رب ❤️</p>
    </div>

    <div class="ticker">
        <marquee behavior="scroll" direction="right">✨ شوف المفاجاه يحبيبي 🌚 من أجمل صدف حياتي ربنا يخليك ليا يا أحلى بيتر في الدنيا ❤️✨</marquee>
    </div>

    <script>
        // حط هنا الباسورد اللي تحبيه (مثلاً تاريخ ميلاده أو اسمك بالانجليزي)
        const correctPassword = "123"; 

        function checkPassword() {
            const val = document.getElementById('passInput').value;
            if(val === correctPassword) {
                document.getElementById('step1').classList.add('hidden');
                document.getElementById('step2').classList.remove('hidden');
                loadQuestion();
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        const questions = [
            { q: "جاوب صح يحبيبي عشان تشوف المفاجاه 😍\n(اكتر أكله بحبها من إيديك؟)", a: "أي حاجة" },
            { q: "جاوب صح يحبيبي عشان تشوف المفاجاه 😍\n(تاريخ اليوم اللي بدأنا فيه حكايتنا؟)", a: "15/5" },
            { q: "جاوب صح يحبيبي عشان تشوف المفاجاه 😍\n(مين أكثر شخص بيحبك في الدنيا دي؟)", a: "مارينا" }
        ];
        let currentQ = 0;

        function loadQuestion() {
            if(currentQ < questions.length) {
                document.getElementById('questionText').innerText = questions[currentQ].q;
            } else {
                document.getElementById('step2').classList.add('hidden');
                document.getElementById('step3').classList.remove('hidden');
                startTyping();
                startCountdown();
            }
        }

        function checkAnswer() {
            const ans = document.getElementById('answerInput').value.trim();
            if(ans !== "") {
                document.getElementById('answerInput').value = "";
                currentQ++;
                loadQuestion();
            } else {
                alert("اكتب الإجابة يا حبيبي الأول 🤍");
            }
        }

        const messageText = "كل سنة وأنت منور حياتي يا أجمل سند وأحن قلب في الدنيا، ربنا يديمك ليا وتفضل دايمًا ناجح ومكسر الدنيا يا بيتر ❤️✨";
        let i = 0;
        function startTyping() {
            if (i < messageText.length) {
                document.getElementById('finalMessage').innerHTML += messageText.charAt(i);
                i++;
                setTimeout(startTyping, 70);
            }
        }

        function startCountdown() {
            // تاريخ بداية العلاقة (مثلاً 15 مايو 2026) أو تاريخ عيد ميلاده
            const startDate = new Date("2026-05-15T00:00:00").getTime();
            setInterval(() => {
                const now = new Date().getTime();
                const diff = now - startDate;
                if(diff > 0) {
                    document.getElementById('days').innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
                    document.getElementById('hours').innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    document.getElementById('minutes').innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    document.getElementById('seconds').innerText = Math.floor((diff % (1000 * 60)) / 1000);
                }
            }, 1000);
        }
    </script>
</body>
</html>
